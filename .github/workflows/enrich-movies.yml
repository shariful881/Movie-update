name: সিনেমার তথ্য (উইকিডাটা)

on:
  push:
    branches: [main]
    paths:
      - scripts/enrich-movies.mjs
      - .github/workflows/enrich-movies.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enrich-movies
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enrich-movies.mjs
      - name: ফলাফল সেভ
        run: |
          git config user.name "cinekhoj-bot"
          git config user.email "cinekhoj-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "কোনো পরিবর্তন নেই"
          else
            git commit -m "সিনেমার তথ্য হালনাগাদ $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
