name: পাতার কাঠামো অনুসন্ধান

on:
  push:
    branches: [main]
    paths:
      - scripts/discover.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/discover.mjs
      - run: |
          git config user.name "cinekhoj-bot"
          git config user.email "cinekhoj-bot@users.noreply.github.com"
          git add data/discovery
          git diff --cached --quiet || (git commit -m "পাতার কাঠামো অনুসন্ধান" && git pull --rebase && git push)
